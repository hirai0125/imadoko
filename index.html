<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>今どこ君</title>
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--bar:#ffffffee;--acc:#1a73e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--fg:#eee;--bar:#2a2a2aee}}
:root[data-theme="dark"]{--bg:#1b1b1b;--fg:#eee;--bar:#2a2a2aee}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
#app{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bar{position:absolute;left:6px;right:6px;background:var(--bar);border-radius:12px;padding:5px 6px;box-shadow:0 1px 8px #0003;z-index:4}
.bar[hidden]{display:none}
[hidden]{display:none!important}
#top{top:6px;display:flex;flex-direction:column;gap:4px}
#top .g{display:grid;gap:4px;align-items:center}#top .g>*{min-width:0}
#r1{grid-template-columns:repeat(5,minmax(0,1fr)) 30px}
#r2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.3fr) 34px}
#r3,#sfcrow{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr)}
#r4{grid-template-columns:minmax(0,1.4fr) minmax(0,.9fr) minmax(0,1fr)}
#pdlg,#ldlg{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
#pdlg .box,#ldlg .box{background:var(--bg);color:var(--fg);border-radius:14px;padding:16px;width:100%;max-width:360px;box-shadow:0 4px 20px #0008}
#pdlg p,#ldlg p{margin:0 0 10px;font-size:14px;line-height:1.5}#pdlg .btns,#ldlg .btns{display:flex;gap:8px;justify-content:flex-end}#pdlg .btns button,#ldlg .btns button{padding:0 14px}
#pdlg .box{max-height:92vh;overflow:auto}#pph{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}#pph div{position:relative;width:64px;height:64px}#pph img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer}#pph button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;padding:0;background:#c62828;font-size:12px}
#pv{position:fixed;inset:0;background:#000d;z-index:40;display:flex;align-items:center;justify-content:center}#pv img{max-width:96vw;max-height:92vh;object-fit:contain}
#pdI{width:100%;box-sizing:border-box;height:90px;font-size:15px;margin:10px 0 6px;border:1px solid #8888;border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--fg);font-family:inherit;resize:none}
.pcs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pcs i{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-sizing:border-box;cursor:pointer;box-shadow:0 0 0 1px #0004}.pcs i.sel{border-color:var(--fg)}
#prow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}#prow .pcs{gap:5px}#prow .pcs i{width:26px;height:26px}
#lst{max-height:50vh;overflow:auto;margin-bottom:10px}#lst div{display:flex;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid #8883;font-size:13px;cursor:pointer}#lst div b{flex:none;width:14px;height:14px;border-radius:50%}#lst div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#lst div em{font-size:10px;opacity:.6;font-style:normal;flex:none}
#top.collapsed>:not(#r1):not(#mrow):not(#prow):not(#padj){display:none}
#loupe{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0007,0 3px 10px #0006;z-index:20;pointer-events:none;background:#fff}#loupe[hidden]{display:none}
#nudge,.nd{display:inline-flex;gap:2px}#nudge button,.nd button{padding:0 8px;min-width:30px}#padj{display:flex;gap:4px;align-items:center;flex-wrap:wrap}#padj[hidden]{display:none}
#mrow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
button,label.btn,select{height:30px;box-sizing:border-box;font-size:12px;border-radius:8px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,label.btn{background:var(--acc);color:#fff;border:0;padding:0 4px;cursor:pointer}
button.off{background:#8a8a8a}
input[type=file]{display:none}
select{padding:0 4px;border:1px solid #8888;background:var(--bg);color:var(--fg)}
#fold{padding:0}
.sl2{display:flex;align-items:center;gap:3px;font-size:11px}.sl2 input{flex:1;min-width:0;width:40px;margin:0}
#mres{font-weight:700;font-size:12px;padding:0 4px}
#bot{bottom:6px;font-size:12px;line-height:1.35;padding:5px 9px;display:flex;flex-direction:column;gap:2px}
#dlg{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}#dlg .box{background:var(--bg);color:var(--fg);border-radius:14px;padding:16px;width:100%;max-width:340px;box-shadow:0 4px 20px #0008}#dlg p{margin:0 0 12px;font-size:14px;line-height:1.5;white-space:pre-line}#dlg input{width:100%;box-sizing:border-box;height:36px;font-size:13px;margin-bottom:12px;border:1px solid #8888;border-radius:8px;padding:0 8px;background:var(--bg);color:var(--fg)}#dlg .btns{display:flex;gap:8px;justify-content:flex-end}#dlg .btns button{padding:0 14px}
#pg{height:6px;border-radius:3px;background:#8884;overflow:hidden}#pg[hidden]{display:none}#pg i{display:block;height:100%;width:0;background:#1a73e8;transition:width .1s}
#sinfo{font-size:11px;opacity:.85;word-break:break-all}#sinfo:empty{display:none}
#bot .r2{display:flex;gap:8px;align-items:center}
#st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#bot.open #st{white-space:normal}
#attr{flex:none;font-size:10px;opacity:.75}#attr[hidden]{display:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="bar" id="top">
    <div class="g" id="r3">
      <select id="zone"></select>
      <button id="swap" class="off">XY:自動</button>
      <button id="unit" class="off">単位:自動</button>
    </div>
    <div class="g" id="sfcrow" hidden>
      <button id="sfcv">図形ON</button>
      <button id="sfcc" class="off">色:元</button>
      <select id="goto"><option value="">移動…</option><option value="img">GeoTIFF全体</option><option value="sfc">SXF(SFC)/SIM</option><option value="kml">KML/KMZ</option></select>
    </div>
    <div class="g" id="r2">
      <select id="bm"><option value="">背景:なし</option><option value="gsi_pale">背景:淡色</option><option value="gsi_std">背景:標準</option><option value="gsi_photo">背景:空中写真</option></select>
      <button id="tcol" class="off">余白:なし</button>
      <label class="sl2">濃さ<input type="range" id="op" min="0" max="100" value="100"></label>
      <button id="bmsave" class="off" title="今の表示範囲の背景地図をオフライン保存">💾</button>
    </div>
    <div class="g" id="r4">
      <button id="cloud" class="off">☁ Box等から開く</button>
      <button id="pinbtn" class="off">📌 ピン</button>
      <select id="clr"><option value="">🗑 クリア…</option><option value="all">すべて消去</option><option value="tif">GeoTIFFのみ</option><option value="sfc">SXF(SFC)のみ</option><option value="kml">KML/KMZのみ</option><option value="meas">距離計測のみ</option><option value="pin">ピンのみ</option></select>
    </div>
    <div class="g" id="r1">
      <label class="btn">📂 開く<input type="file" id="file" multiple></label>
      <button id="gps">📍 現在地</button>
      <button id="fol" class="off">追従OFF</button>
      <button id="fit">⤢ 全体</button>
      <button id="meas" class="off">📏 計測</button>
      <button id="fold" class="off" title="上の段を隠す/出す">▲</button>
      <button id="goloc" hidden></button>
    </div>
    <div id="prow" hidden><span class="pcs" id="pcsTop"></span><button id="pgps" class="off" style="padding:0 10px">📍 現在地に</button><button id="plist" class="off" style="padding:0 10px">📋 一覧</button><span id="pmsg" style="font-size:12px;font-weight:700">地図をタップしてピンを立てます</span></div>
    <div id="padj" hidden><span style="font-size:12px;font-weight:700">ピンをドラッグ/矢印で位置を合わせる</span><span id="pnudge" class="nd"><button class="off" data-n="-1,0">◀</button><button class="off" data-n="0,-1">▲</button><button class="off" data-n="0,1">▼</button><button class="off" data-n="1,0">▶</button></span><button id="padjNo" class="off" style="padding:0 10px">元に戻す</button><button id="padjOk" style="padding:0 12px">決定</button></div>
    <div id="mrow" hidden>
      <button id="mundo" class="off" style="padding:0 10px">1点戻す</button>
      <button id="mclr" class="off" style="padding:0 10px">クリア</button>
      <span id="nudge" title="選んだ点を少しずつ動かす"><button class="off" data-n="-1,0">◀</button><button class="off" data-n="0,-1">▲</button><button class="off" data-n="0,1">▼</button><button class="off" data-n="1,0">▶</button></span>
      <span id="mres">地図をタップして点を追加</span>
    </div>
  </div>
  <div id="pv" hidden><img alt=""></div>
  <div id="pdlg" hidden><div class="box"><p id="pdT">ピン</p><div class="pcs" id="pcs"></div><textarea id="pdI" placeholder="コメントを入力"></textarea><div class="btns" style="justify-content:flex-start;margin:0 0 8px"><button id="pdCam" class="off">📷 撮影</button><button id="pdPick" class="off">🖼 写真を選ぶ</button><button id="pdAdj" class="off">🎯 位置を微調整</button></div><div id="pph"></div><input type="file" id="pfCam" accept="image/*" capture="environment"><input type="file" id="pfPick" accept="image/*" multiple><p id="pdM" style="font-size:11px;opacity:.7;margin:0 0 10px"></p><div class="btns" style="justify-content:flex-start;margin-bottom:8px"><button id="pdShare" class="off">📤 共有</button><button id="pdLine" style="background:#06c755">位置をLINEで送る</button><button id="pdPhoto" style="background:#06c755" hidden>📷 写真をLINEへ</button></div><div class="btns"><button id="pdDel" class="off">削除</button><button id="pdNo" class="off">キャンセル</button><button id="pdOk">保存</button></div></div></div>
  <div id="ldlg" hidden><div class="box"><p id="lT">ピン一覧</p><div id="lst"></div><div class="btns"><button id="lAll" class="off">全部を送る</button><button id="lLine" style="background:#06c755">全部をLINEで送る</button><button id="lKml" class="off">KML</button><button id="lNo">閉じる</button></div></div></div>
  <div id="dlg" hidden><div class="box"><p id="dlgT"></p><input id="dlgI" hidden><div class="btns"><button id="dlgNo" class="off">キャンセル</button><button id="dlgOk">OK</button></div></div></div>
  <canvas id="loupe" width="240" height="240" hidden></canvas><div class="bar" id="bot"><div id="sinfo"></div><div id="pg" hidden><i></i></div><div class="r2"><span id="st">「📂 開く」からGeoTIFF・SXF・SIM・KMLを選んでください</span><span id="attr" hidden>出典: 国土地理院タイル</span></div></div>
</div>

  try{
    const d=img.fileDirectory, bps=Array.from(d.BitsPerSample||[8]), spp=d.SamplesPerPixel||1, ph=d.PhotometricInterpretation;
    if(d.Compression!==1||d.TileWidth||bps.some(b=>b!==8)||(d.PlanarConfiguration||1)!==1) return null;

function geoDist(lon1,lat1,lon2,lat2){   // GRS80楕円体上の測地線距離(Vincenty)
  const a=6378137,f=1/298.257222101,b=a*(1-f),r=Math.PI/180;
  const L=(lon2-lon1)*r, U1=Math.atan((1-f)*Math.tan(lat1*r)), U2=Math.atan((1-f)*Math.tan(lat2*r));
  const sU1=Math.sin(U1),cU1=Math.cos(U1),sU2=Math.sin(U2),cU2=Math.cos(U2);
  let lam=L,lamP,it=0,sS,cS,sig,sA,c2A,c2SM;
  do{ const sl=Math.sin(lam),cl=Math.cos(lam);
    sS=Math.hypot(cU2*sl,cU1*sU2-sU1*cU2*cl); if(sS===0) return 0;
    cS=sU1*sU2+cU1*cU2*cl; sig=Math.atan2(sS,cS); sA=cU1*cU2*sl/sS; c2A=1-sA*sA;

  }while(Math.abs(lam-lamP)>1e-12&&++it<100);

  return b*A*(sig-dS);
}

// アプリ内ダイアログ(Artifactなどでは confirm/prompt が使えないため)
function ask(text,o){
  o=o||{};

    const d=$('dlg'), i=$('dlgI'), hasIn=o.input!=null;
    $('dlgT').textContent=text; i.hidden=!hasIn; i.value=''; i.placeholder=hasIn?o.input:''; $('dlgOk').textContent=o.ok||'OK'; d.hidden=false;
    if(hasIn) setTimeout(()=>i.focus(),50);

  });
}

// 地図データが無いときは、現在地の周囲に背景地図用の枠を作って表示する
function bmFrame(){
  if(geo||!bm.src) return;
  if(!pt){ if(watchId===null) $('gps').click(); st('現在地を取得して背景地図を表示します…(位置情報を許可してください)'); return; }

const BM={gsi_pale:['pale','png'],gsi_std:['std','png'],gsi_photo:['seamlessphoto','jpg']};
let bm={src:'',op:1}, tiles=new Map(), tcache=null, tdraw=0;
const tileUrl=(k,z,x,y)=>`https://cyberjapandata.gsi.go.jp/xyz/${BM[k][0]}/${z}/${x}/${y}.${BM[k][1]}`;
const t2lon=(x,z)=>x/2**z*360-180, t2lat=(y,z)=>Math.atan(Math.sinh(Math.PI*(1-2*y/2**z)))*180/Math.PI;
const ll2t=(lon,lat,z)=>{ const n=2**z, r=lat*Math.PI/180; return [Math.floor((lon+180)/360*n),Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)]; };
function pxToLL(px,py){ const x=px/geo.sc*geo.r[0]+geo.o[0], y=py/geo.sc*geo.r[1]+geo.o[1]; return geo.c.geographic?[x,y]:proj4(geo.c.def,'WGS84',[x,y]); }
function vis(){
  const cw=cv.clientWidth, ch=cv.clientHeight, inv=(sx,sy)=>pxToLL((sx-view.x)/view.s,(sy-view.y)/view.s);
  const P=[inv(0,0),inv(cw,0),inv(0,ch),inv(cw,ch)], m=inv(cw/2,ch/2), m2=inv(cw/2+100,ch/2);
  const mpp=Math.hypot((m2[0]-m[0])*Math.cos(m[1]*Math.PI/180),m2[1]-m[1])*111320/100;
  if(!(mpp>0)||P.some(p=>!isFinite(p[0])||!isFinite(p[1]))) return null;
  const lo=P.map(p=>p[0]), la=P.map(p=>p[1]);
  return {z:Math.max(5,Math.min(18,Math.round(Math.log2(156543.03*Math.cos(m[1]*Math.PI/180)/mpp)))),lo0:Math.min(...lo),lo1:Math.max(...lo),la0:Math.min(...la),la1:Math.max(...la)};
}
function range(v,z){ const [x0,y1]=ll2t(v.lo0,v.la0,z), [x1,y0]=ll2t(v.lo1,v.la1,z); return {x0,x1,y0,y1,n:(x1-x0+1)*(y1-y0+1)}; }
async function fetchTile(url,keep){
  if(tcache===null){ try{ tcache=await caches.open('map-tiles'); }catch(_){ tcache=false; } }
  let r=tcache?await tcache.match(url):null;
  if(!r){ try{ r=await fetch(url,{mode:'cors'}); }catch(e){ tstat.err='通信エラー('+((e&&e.message)||e)+')'; throw e; } if(!r.ok){ tstat.err='HTTP '+r.status; throw new Error('HTTP '+r.status); } if(tcache) tcache.put(url,r.clone()); }
  return keep?createImageBitmap(await r.blob()):r.body&&r.arrayBuffer();
}
const tstat={ok:0,fail:0};
const imgTile=u=>new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=u; });
function attrUpd(){
  const bad=tstat.fail>3&&!tstat.ok;
  $('attr').textContent='出典: 国土地理院タイル'+(bad?'(取得不可)':'');
  if(bad&&!tstat.warned){ tstat.warned=true; st('背景地図(国土地理院)を取得できません。機内モード・圏外・通信制限、または背景取得をブロックする設定(データセーバー/VPN/広告ブロック)を確認してください。一度表示した範囲は、電波のある所で「💾」で保存すると圏外でも使えます(claude.ai上のArtifactでは表示できません)'+(tstat.err?' [原因: '+tstat.err+(location.protocol==='file:'?' / ファイルを直接開いています':'')+(/claude\.ai|claudeusercontent/.test(location.hostname)?' / Artifact上で開いています':'')+']':'')); }
}
function tileBmp(url){
  const v=tiles.get(url); if(v&&v.width) return v;
  if(v===undefined||(v&&v.f&&Date.now()-v.f>15000)){
    tiles.set(url,null);
    const done=b=>{ tiles.set(url,b); tstat.ok++; attrUpd(); if(tiles.size>400) for(const k of tiles.keys()){ tiles.delete(k); if(tiles.size<=300) break; }
      if(!tdraw) tdraw=requestAnimationFrame(()=>{ tdraw=0; draw(); }); };
    fetchTile(url,true).then(done).catch(()=>imgTile(url).then(im=>{ if(im) done(im); else { tiles.set(url,{f:Date.now()}); tstat.fail++; attrUpd(); } }));
  }
  return null;
}
function drawTiles(){
  let v; try{ v=vis(); }catch(_){ return; } if(!v) return;
  const z=v.z, r=range(v,z); if(r.n>120) return;
  ctx.imageSmoothingEnabled=true;
  for(let y=r.y0;y<=r.y1;y++) for(let x=r.x0;x<=r.x1;x++){
    const b=tileBmp(tileUrl(bm.src,z,x,y)); if(!b) continue;
    const p0=toPx(t2lon(x,z),t2lat(y,z)), p1=toPx(t2lon(x+1,z),t2lat(y,z)), p2=toPx(t2lon(x,z),t2lat(y+1,z)), w=b.width, h=b.height;
    ctx.save(); ctx.transform((p1.px-p0.px)/w,(p1.py-p0.py)/w,(p2.px-p0.px)/h,(p2.py-p0.py)/h,p0.px,p0.py);
    ctx.drawImage(b,-.5,-.5,w+1,h+1); ctx.restore();
  }
}

$('bmsave').onclick=async()=>{
  if(!bm.src||!geo) return st('背景地図を選び、地図を読み込んでから実行してください');
  const v=vis(); if(!v) return;
  const list=[]; let zmax=Math.min(18,v.z+3);
  const build=zm=>{ list.length=0; for(let z=v.z;z<=zm;z++){ const r=range(v,z); for(let y=r.y0;y<=r.y1;y++) for(let x=r.x0;x<=r.x1;x++) list.push(tileUrl(bm.src,z,x,y)); } };
  build(zmax); while(list.length>3000&&zmax>v.z){ zmax--; build(zmax); }
  if(list.length>3000) return st('範囲が広すぎます。拡大してから実行してください');
  if(!(await ask(`今の表示範囲の背景地図 ${list.length}枚(約${Math.ceil(list.length*0.03)}MB)を保存します。\n電波のある場所で実行してください。`,{ok:'保存する'}))) return;
  let done=0, fail=0, i=0;
  const worker=async()=>{ while(i<list.length){ const u=list[i++]; try{ await fetchTile(u,false); }catch(_){ fail++; } done++; if(done%10===0||done===list.length) progress(`背景地図を保存中 ${done}/${list.length}`,done/list.length); } };
  await Promise.all(Array.from({length:6},worker));
  progress(null); st(`背景地図の保存完了 ${list.length-fail}枚${fail?`(失敗${fail}枚)`:''}`);
};

// ===== ファイルを開く(GeoTIFF/SXFを中身で自動判別・複数選択可) =====
async function fileKind(f){
  if(/\.km[lz]$/i.test(f.name||'')) return 'kml';
  if(/\.sima?$/i.test(f.name||'')) return 'sim';
  const h=new Uint8Array(await f.slice(0,4).arrayBuffer());
  if((h[0]===0x49&&h[1]===0x49&&(h[2]===42||h[2]===43))||(h[0]===0x4d&&h[1]===0x4d&&(h[3]===42||h[3]===43))) return 'tif';
  if(h[0]===0x50&&h[1]===0x4b){
    if(typeof JSZip!=='undefined'){ try{ const z=await JSZip.loadAsync(await f.arrayBuffer()); if(Object.keys(z.files).some(n=>/\.kml$/i.test(n))) return 'kml'; }catch(_){} }
    return 'sxf';
  }
  { const hd=await f.slice(0,4096).text(); if(/<kml[\s>]/i.test(hd)) return 'kml'; if(/^\s*G00\s*,/i.test(hd)&&!/ISO-10303/i.test(hd)) return 'sim'; }
  return 'sxf';
}
// エラーを「名前: 内容 + 対処」の形にする
function errText(e,fname){
  const n=(e&&e.name)||'Error', m=(e&&e.message)||String(e); let h='';
  if(/NotReadable|NotFound|Security|ERR_UPLOAD|could not be read|permission/i.test(n+' '+m)) h=' → ファイルを読めませんでした。BoxやDropboxのアプリで「オフラインで利用可能」にするか、いったん端末の「ダウンロード」フォルダへ保存してから、もう一度選んでください';
  else if(/memory|allocation|Array buffer|Invalid typed array length|RangeError/i.test(n+' '+m)) h=' → メモリ不足です。他のアプリを閉じてからやり直してください';
  return (fname?fname+': ':'')+n+': '+m+h;
}
// 選んだファイルを、アプリ内にいったん分割コピーする(クラウドアプリ経由のファイルは、後から読むと失敗することがあるため)
async function snapshot(f,label){
  const CH=8<<20, parts=[];
  try{
    for(let o=0;o<f.size;o+=CH){ parts.push(await f.slice(o,Math.min(f.size,o+CH)).arrayBuffer()); if(f.size>CH) progress(`${label||f.name} を取り込み中`,Math.min(f.size,o+CH)/f.size); }
    progress(null);
    const b=new Blob(parts); parts.length=0;
    if(b.size!==f.size) throw new Error('取り込んだサイズが一致しません('+b.size+'/'+f.size+')');
    return new File([b],f.name,{type:f.type});
  }catch(e){ progress(null); e.message=(e.message||'')+' [取り込み中]'; throw e; }
}
async function openFiles(files){
  const arr=[]; let i=0;
  for(const f0 of files){ i++; let f; try{ f=await snapshot(f0,`(${i}/${files.length}) ${f0.name}`); }catch(e){ st('エラー: '+errText(e,f0.name)); sinfo('読み込み失敗: '+f0.name+' ('+(f0.size||0)+' bytes)'); return; }
    arr.push({f,k:await fileKind(f)}); }
  const ord={tif:0,kml:1,sxf:2,sim:2}; arr.sort((a,b)=>ord[a.k]-ord[b.k]); batchFiles=arr.map(x=>x.f);
  let tifDone=false; batch=true;
  try{ for(const {f,k} of arr){ if(k==='tif'){ if(tifDone) continue; tifDone=true; await load(f); } else if(k==='kml') await loadKml(f); else if(k==='sim') await loadSim(f); else await loadSfc(f); } }
  finally{ batch=false; }
  if(tifDone) fit(); else focusOverlay((kdraw&&kdraw.bbox)||(sdraw&&sdraw.bbox));
}
$('cloud').onclick=async()=>{
  let seen=false; try{ seen=!!localStorage.getItem('guideSeen'); }catch(_){}
  if(!seen){
    const ok=await ask('ファイル選択画面が開きます。\n左上の「≡」を押すと、端末内のストレージ・Box・Dropbox・Googleドライブなどを選べます。虫眼鏡でファイル名の検索もできます。(各アプリを入れてログインしておいてください)\n\nBoxやDropboxのアプリから「共有」→「今どこ君」で直接送ることもできます(ホーム画面に追加したアプリのみ)。',{ok:'ファイル選択を開く'});
    if(!ok) return;
    try{ localStorage.setItem('guideSeen','1'); }catch(_){}
  }
  $('file').click();
};
$('file').onchange=async e=>{ const fs=[...e.target.files]; try{ if(fs.length) await openFiles(fs); }catch(err){ st('読み込みエラー: '+errText(err)); } finally{ e.target.value=''; } };


// パン・ズーム (タッチ/マウス/ピンチ)
const ptrs=new Map(); let lastD=0, tap=null;
cv.onpointerdown=e=>{ const first=ptrs.size===0;
  if(first) tap={x:e.clientX,y:e.clientY,t:Date.now(),n:1,moved:false}; else { if(tap) tap.n=2; meas.drag=null; if(padj) padj.drag=null; hideLoupe(); }
  if(first&&meas.on&&geo){ const r=cv.getBoundingClientRect(), fx=e.clientX-r.left, fy=e.clientY-r.top, h=measHit(fx,fy); if(h){ meas.sel=h.i; meas.drag={i:h.i,ox:h.x-fx,oy:h.y-fy}; draw(); } }
  if(first&&padj&&geo){ const r=cv.getBoundingClientRect(), fx=e.clientX-r.left, fy=e.clientY-r.top, h=padjHit(fx,fy); if(h) padj.drag={ox:h.x-fx,oy:h.y-fy}; }
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});lastD=0;};
cv.onpointercancel=e=>{ptrs.delete(e.pointerId);lastD=0;tap=null;meas.drag=null;if(padj) padj.drag=null;hideLoupe();};
cv.onpointerup=e=>{ ptrs.delete(e.pointerId);lastD=0;
  if(padj&&padj.drag){ padj.drag=null; hideLoupe(); pinSave(); draw(); }
  else if(padj){ }
  else if(meas.drag){ meas.drag=null; hideLoupe(); draw(); }
  else if(tap&&tap.n===1&&!tap.moved&&Date.now()-tap.t<700){ const r=cv.getBoundingClientRect(), fx=e.clientX-r.left, fy=e.clientY-r.top;
    const h=(!meas.on&&geo)?pinHit(fx,fy):-1;
    if(h>=0) editPin(h,false); else if(pinOn) addPinAt(fx,fy); else if(meas.on) addMeasAt(fx,fy); }
  if(!ptrs.size) tap=null; };
cv.onpointermove=e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8) tap.moved=true;
  if(ptrs.size===1&&padj&&padj.drag){ const r=cv.getBoundingClientRect(); movePinTo(e.clientX-r.left+padj.drag.ox,e.clientY-r.top+padj.drag.oy,e.clientX); }
  else if(ptrs.size===1&&meas.drag){ const r=cv.getBoundingClientRect(); moveMeasTo(meas.drag.i,e.clientX-r.left+meas.drag.ox,e.clientY-r.top+meas.drag.oy,e.clientX); }
  else if(ptrs.size===1){ view.x+=e.clientX-p.x; view.y+=e.clientY-p.y; }
  p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
    if(lastD) zoom(d/lastD,(a.x+b.x)/2,(a.y+b.y)/2); lastD=d;
  }
  draw();
};
function zoom(k,cx,cy){ const s=Math.min(Math.max(view.s*k,0.02),40),f=s/view.s; view.x=cx-(cx-view.x)*f; view.y=cy-(cy-view.y)*f; view.s=s; }
cv.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY);draw();};
addEventListener('resize',draw);
draw();
</script>
<script>
// 他のアプリ(Box・Dropbox・ファイル等)の「共有」から送られたファイルを読み込む
(async()=>{
  if(!/[?&]shared=/.test(location.search)||!window.caches) return;
  try{
    const c=await caches.open('shared-files'), ks=await c.keys(), files=[];
    for(const k of ks){ const r=await c.match(k); files.push(new File([await r.blob()],decodeURIComponent(k.url.split('/').pop()))); }
    history.replaceState(null,'',location.pathname);
    if(files.length){ st('共有されたファイルを読み込み中…'); await openFiles(files); st('共有されたファイルを読み込みました'); }
    for(const k of ks) await c.delete(k);
  }catch(e){ st('共有ファイルの読み込みエラー: '+e.message); }
})();
</script>

addEventListener('load',()=>{ const m=[['proj4',typeof proj4],['GeoTIFF',typeof GeoTIFF],['JSZip',typeof JSZip]].filter(x=>x[1]==='undefined').map(x=>x[0]); const e=document.getElementById('st'); if(m.length&&e) e.textContent='部品を読み込めません: '+m.join(', ')+' (単体版 field-map.html を使ってください)'; });
addEventListener('error',e=>{ const t=document.getElementById('st'); if(t) t.textContent='エラー: '+(e.message||'不明'); });
addEventListener('unhandledrejection',e=>{ const t=document.getElementById('st'); if(t) t.textContent='エラー: '+((e.reason&&e.reason.message)||e.reason); });
</script>
